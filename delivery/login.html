<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - instaa Groceries Made Easier</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 2rem 1rem 6rem;
    }
    .auth-card {
      background-color: var(--bg-card);
      border-radius: var(--radius-xl);
      max-width: 500px;
      width: 100%;
      box-shadow: var(--shadow-xl);
      overflow: hidden;
      animation: scaleUp 0.3s ease;
    }
    .auth-header {
      background: var(--primary-gradient);
      color: #fff;
      padding: 2rem;
      text-align: center;
    }
    .auth-brand {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin: 0 auto 0.75rem;
    }
    .auth-header h2 {
      color: #fff;
      font-size: 1.5rem;
      margin-bottom: 0.25rem;
    }
    .auth-header p {
      color: #bfdbfe;
      font-size: 0.875rem;
    }
    /* Role Selector Tabs */
    .role-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background-color: #f1f5f9;
      border-bottom: 1px solid var(--border-light);
    }
    .role-tab-btn {
      padding: 0.85rem 0.25rem;
      background: none;
      border: none;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      transition: all var(--transition-fast);
      border-bottom: 3px solid transparent;
    }
    .role-tab-btn:hover {
      color: var(--primary);
    }
    .role-tab-btn.active {
      color: var(--primary);
      background-color: #fff;
      border-bottom-color: var(--primary);
    }
    .role-tab-btn i {
      font-size: 1.1rem;
    }
    .auth-body {
      padding: 2rem;
    }
    /* Demo Quick Autofill Chips */
    .demo-preset-section {
      background-color: var(--bg-alt);
      border-radius: var(--radius-lg);
      padding: 1rem;
      margin-bottom: 1.5rem;
      border: 1px dashed var(--border-light);
    }
    .demo-preset-header {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .demo-chips-grid {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .demo-chip {
      background: #fff;
      border: 1px solid var(--border-light);
      padding: 0.35rem 0.65rem;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all var(--transition-fast);
    }
    .demo-chip:hover {
      border-color: var(--primary);
      color: var(--primary);
      background-color: var(--primary-light);
    }
    .auth-footer {
      text-align: center;
      padding: 1.25rem 2rem;
      background-color: var(--bg-alt);
      border-top: 1px solid var(--border-light);
      font-size: 0.9rem;
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand" style="background: rgba(255, 255, 255, 0.25);">
        <i class="fa-solid fa-bicycle"></i>
      </div>
      <h2 style="letter-spacing: -0.5px; margin-bottom: 0.15rem;">instaa</h2>
      <span style="font-size: 0.72rem; letter-spacing: 0.8px; text-transform: uppercase; opacity: 0.9; display: block; margin-bottom: 0.5rem;">GROCERIES MADE EASIER</span>
      <p id="role-subtitle" style="font-size: 0.82rem; margin: 0; opacity: 0.95;">Rural Hyperlocal Q-Commerce Portal</p>
    </div>

    <!-- 4 Role Tabs -->
    <div class="role-tabs">
      <button class="role-tab-btn active" data-role="customer" onclick="selectRoleTab('customer')">
        <i class="fa-solid fa-user"></i>
        <span>Customer</span>
      </button>
      <button class="role-tab-btn" data-role="rider" onclick="selectRoleTab('rider')">
        <i class="fa-solid fa-motorcycle"></i>
        <span>Rider</span>
      </button>
      <button class="role-tab-btn" data-role="store" onclick="selectRoleTab('store')">
        <i class="fa-solid fa-store"></i>
        <span>Store</span>
      </button>
      <button class="role-tab-btn" data-role="admin" onclick="selectRoleTab('admin')">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Admin</span>
      </button>
    </div>

    <div class="auth-body">
      <!-- 1-Click Demo Credentials Preset -->
      <div class="demo-preset-section">
        <div class="demo-preset-header">
          <span><i class="fa-solid fa-wand-magic-sparkles text-primary"></i> 1-Click Demo Login</span>
          <span style="font-weight: 500; text-transform: none;">Click to fill & login</span>
        </div>
        <div class="demo-chips-grid" id="demo-chips-container">
          <!-- Dynamically filled based on selected tab -->
        </div>
      </div>

      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <input type="hidden" id="login-role" value="customer">

        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="login-email" class="form-control" placeholder="name@domain.com" required>
          </div>
        </div>

        <div class="form-group">
          <div class="flex justify-between items-center" style="margin-bottom: 0.4rem;">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
            <span style="font-size: 0.75rem; color: var(--text-light);">Demo: pass123 / admin123</span>
          </div>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
            <button type="button" class="password-toggle-btn" onclick="Auth.togglePasswordVisibility('login-password', 'toggle-icon')">
              <i class="fa-solid fa-eye" id="toggle-icon"></i>
            </button>
          </div>
        </div>

        <div id="login-error-alert" class="alert-box" style="display: none; background-color: var(--danger-light); color: var(--danger-dark); margin-bottom: 1.25rem;">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="login-error-text"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login-submit">
          <i class="fa-solid fa-right-to-bracket"></i> Login to Portal
        </button>
      </form>
    </div>

    <div class="auth-footer">
      <span id="register-prompt-text">Don't have an account?</span> 
      <a href="register.html" style="font-weight: 700;">Create Account</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/dispatch.js"></script>
  <script src="js/otp.js"></script>
  <script src="js/wallet.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>

  <script>
    const DEMO_PRESETS = {
      customer: [
        { label: 'Priya (Town A: Rampur)', email: 'customer@demo.com', pass: 'pass123' },
        { label: 'Rahul (Town B: Shampur)', email: 'customer2@demo.com', pass: 'pass123' }
      ],
      rider: [
        { label: 'Alex (Town A Rider)', email: 'rider1@demo.com', pass: 'pass123' },
        { label: 'Ben (Town A Rider)', email: 'rider2@demo.com', pass: 'pass123' },
        { label: 'Maya (Town B Rider)', email: 'rider3@demo.com', pass: 'pass123' },
        { label: 'Vikram (Town B Rider)', email: 'rider4@demo.com', pass: 'pass123' }
      ],
      store: [
        { label: 'FreshMart (Town A)', email: 'store@demo.com', pass: 'pass123' },
        { label: 'Shampur Daily (Town B)', email: 'store2@demo.com', pass: 'pass123' }
      ],
      admin: [
        { label: 'Super Admin', email: 'admin@demo.com', pass: 'admin123' }
      ]
    };

    function selectRoleTab(role) {
      document.querySelectorAll('.role-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.role === role);
      });

      document.getElementById('login-role').value = role;
      document.getElementById('role-subtitle').textContent = `Sign in as ${role.toUpperCase()}`;

      // Update Demo Chips
      const container = document.getElementById('demo-chips-container');
      const presets = DEMO_PRESETS[role] || [];
      container.innerHTML = presets.map(p => `
        <button type="button" class="demo-chip" onclick="fillAndSubmit('${p.email}', '${p.pass}', '${role}')">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> ${p.label}
        </button>
      `).join('');

      // Clear any errors
      document.getElementById('login-error-alert').style.display = 'none';

      // Default fill first preset into fields
      if (presets.length > 0) {
        document.getElementById('login-email').value = presets[0].email;
        document.getElementById('login-password').value = presets[0].pass;
      }
    }

    function fillAndSubmit(email, password, role) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = password;
      document.getElementById('login-role').value = role;

      const result = Auth.loginUser(email, password, role);
      if (result.success) {
        window.location.href = result.redirectUrl;
      } else {
        showError(result.message);
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const role = document.getElementById('login-role').value;

      const btn = document.getElementById('btn-login-submit');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      setTimeout(() => {
        const result = Auth.loginUser(email, password, role);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login to Portal';

        if (result.success) {
          window.location.href = result.redirectUrl;
        } else {
          showError(result.message);
        }
      }, 300);
    }

    function showError(msg) {
      const alert = document.getElementById('login-error-alert');
      document.getElementById('login-error-text').textContent = msg;
      alert.style.display = 'flex';
    }

    // Check if role passed in URL (e.g. login.html?role=rider)
    const urlParams = new URLSearchParams(window.location.search);
    const initialRole = urlParams.get('role') || 'customer';
    selectRoleTab(initialRole);
  </script>
</body>
</html>
