# Netlify Deployment Configuration for INSTAA
# Rural Hyperlocal Q-Commerce Ecosystem

[build]
  # Directory containing application static files
  publish = "."

# Custom HTTP Headers for Map Tiles, GPS Geolocation & Assets
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Permissions-Policy = "geolocation=(self)"
    X-Content-Type-Options = "nosniff"

# If you deploy server.js to a free backend host (e.g. Render, Railway, Koyeb),
# uncomment the proxy rule below and replace with your backend URL.
# Netlify will transparently proxy all real-time tracking requests to your backend:
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-instaa-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

