<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - instaa Groceries Made Easier</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 2.5rem 1rem 6rem;
    }
    .auth-card {
      background-color: var(--bg-card);
      border-radius: var(--radius-xl);
      max-width: 540px;
      width: 100%;
      box-shadow: var(--shadow-xl);
      overflow: hidden;
      animation: scaleUp 0.3s ease;
    }
    .auth-header {
      background: var(--primary-gradient);
      color: #fff;
      padding: 2rem;
      text-align: center;
    }
    .auth-header h2 {
      font-size: 1.5rem;
      color: #fff;
      margin-bottom: 0.25rem;
    }
    .auth-header p {
      color: #bfdbfe;
      font-size: 0.875rem;
    }
    .role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background-color: #f1f5f9;
      border-bottom: 1px solid var(--border-light);
    }
    .role-tab-btn {
      padding: 1rem;
      background: none;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border-bottom: 3px solid transparent;
      transition: all var(--transition-fast);
    }
    .role-tab-btn.active {
      color: var(--primary);
      background-color: #fff;
      border-bottom-color: var(--primary);
    }
    .auth-body {
      padding: 2rem;
    }
    .auth-footer {
      text-align: center;
      padding: 1.25rem 2rem;
      background-color: var(--bg-alt);
      border-top: 1px solid var(--border-light);
      font-size: 0.9rem;
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 0.5rem;">
        <i class="fa-solid fa-bicycle"></i>
      </div>
      <h2 style="letter-spacing: -0.5px; margin-bottom: 0.15rem;">instaa</h2>
      <span style="font-size: 0.72rem; letter-spacing: 0.8px; text-transform: uppercase; opacity: 0.9; display: block; margin-bottom: 0.25rem;">GROCERIES MADE EASIER</span>
      <p id="reg-subtitle" style="font-size: 0.85rem; margin: 0;">Create a Customer or Delivery Rider account</p>
    </div>

    <!-- Customer vs Rider Tabs -->
    <div class="role-tabs">
      <button class="role-tab-btn active" data-role="customer" onclick="selectRegTab('customer')">
        <i class="fa-solid fa-bag-shopping"></i> Customer Account
      </button>
      <button class="role-tab-btn" data-role="rider" onclick="selectRegTab('rider')">
        <i class="fa-solid fa-motorcycle"></i> Rider Account
      </button>
    </div>

    <div class="auth-body">
      <form id="reg-form" onsubmit="handleRegisterSubmit(event)">
        <input type="hidden" id="reg-role" value="customer">

        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-user input-icon"></i>
            <input type="text" id="reg-name" class="form-control" placeholder="e.g. Ananya Roy" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-town">Operating Town / Cluster</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-tree-city input-icon"></i>
            <select id="reg-town" class="form-control" required>
              <option value="TOWN-01">Town A: Rampur (KA-01)</option>
              <option value="TOWN-02">Town B: Shampur (KA-02)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="reg-email" class="form-control" placeholder="name@domain.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-phone">Phone Number</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-phone input-icon"></i>
            <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98000 00000" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
            <button type="button" class="password-toggle-btn" onclick="Auth.togglePasswordVisibility('reg-password', 'reg-pass-icon')">
              <i class="fa-solid fa-eye" id="reg-pass-icon"></i>
            </button>
          </div>
        </div>

        <!-- Conditional Customer Address Field -->
        <div class="form-group" id="group-customer-address">
          <label class="form-label" for="reg-address">Delivery Address</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-location-dot input-icon"></i>
            <input type="text" id="reg-address" class="form-control" placeholder="Flat No, Building, Street, City, Pincode">
          </div>
        </div>

        <!-- Conditional Rider Vehicle Field -->
        <div class="form-group" id="group-rider-vehicle" style="display: none;">
          <label class="form-label" for="reg-vehicle">Vehicle Details & Number</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-motorcycle input-icon"></i>
            <input type="text" id="reg-vehicle" class="form-control" placeholder="e.g. Honda Activa (KA-01-AB-1234)">
          </div>
        </div>

        <div id="reg-error-alert" class="alert-box" style="display: none; background-color: var(--danger-light); color: var(--danger-dark); margin-bottom: 1.25rem;">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="reg-error-text"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-reg-submit">
          <i class="fa-solid fa-user-plus"></i> Complete Registration
        </button>
      </form>
    </div>

    <div class="auth-footer">
      Already have an account? <a href="login.html" style="font-weight: 700;">Login Here</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/dispatch.js"></script>
  <script src="js/otp.js"></script>
  <script src="js/wallet.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>

  <script>
    function selectRegTab(role) {
      document.querySelectorAll('.role-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.role === role);
      });

      document.getElementById('reg-role').value = role;
      document.getElementById('group-customer-address').style.display = role === 'customer' ? 'block' : 'none';
      document.getElementById('group-rider-vehicle').style.display = role === 'rider' ? 'block' : 'none';
      document.getElementById('reg-subtitle').textContent = `Sign up as a ${role.toUpperCase()} to get started`;
      document.getElementById('reg-error-alert').style.display = 'none';
    }

    function handleRegisterSubmit(e) {
      e.preventDefault();
      const role = document.getElementById('reg-role').value;
      const name = document.getElementById('reg-name').value;
      const townId = document.getElementById('reg-town').value;
      const townName = townId === 'TOWN-02' ? 'Town B (Shampur)' : 'Town A (Rampur)';
      const email = document.getElementById('reg-email').value;
      const phone = document.getElementById('reg-phone').value;
      const password = document.getElementById('reg-password').value;
      const address = document.getElementById('reg-address').value;
      const vehicle = document.getElementById('reg-vehicle').value;

      const btn = document.getElementById('btn-reg-submit');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';

      setTimeout(() => {
        const result = Auth.registerUser({
          role,
          name,
          townId,
          townName,
          email,
          phone,
          password,
          address,
          vehicle
        });

        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Complete Registration';

        if (result.success) {
          Notifications.showToast('Account Created!', `Welcome to SmartDispatch, ${name}!`, 'success');
          setTimeout(() => {
            window.location.href = result.redirectUrl;
          }, 800);
        } else {
          document.getElementById('reg-error-text').textContent = result.message;
          document.getElementById('reg-error-alert').style.display = 'flex';
        }
      }, 400);
    }
  </script>
</body>
</html>
